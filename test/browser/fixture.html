<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>webgpu-radar browser test fixture</title>
  </head>
  <body>
    <p>Runs probe() against the built dist/ bundle; results land on window.</p>
    <script type="module">
      import { generateReport, probe } from "/dist/index.js";
      try {
        const result = await probe({ mode: "quick" });
        window.__report = generateReport(result);
        window.__probeResult = result; // set last: tests wait on this key
      } catch (e) {
        window.__probeError = e instanceof Error ? (e.stack ?? e.message) : String(e);
      }
    </script>
  </body>
</html>
